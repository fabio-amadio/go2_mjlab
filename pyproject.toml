[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-mjlab"
version = "0.1.0"
description = "Standalone Unitree Go2 velocity environments for mjlab."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.14"
dependencies = [
  "mjlab>=1.5.2,<1.6.0",
]

[project.optional-dependencies]
cu128 = [
  "mjlab[cu128]>=1.5.2,<1.6.0",
  "torch>=2.7.0",
]
cpu = [
  "mjlab[cpu]>=1.5.2,<1.6.0",
  "torch>=2.7.0",
]

[project.entry-points."mjlab.tasks"]
go2_mjlab = "go2_mjlab.tasks"

[project.scripts]
train = "go2_mjlab.scripts.train:main"
play = "go2_mjlab.scripts.play:main"
rollout = "go2_mjlab.scripts.rollout:main"
list-envs = "go2_mjlab.scripts.list_envs:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.14.14",
  "ty>=0.0.14",
  "pyright>=1.1.408",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
go2_mjlab = [
  "py.typed",
  "robots/unitree_go2/xmls/go2.xml",
  "robots/unitree_go2/xmls/assets/*.obj",
]

[tool.uv]
conflicts = [
  [{extra = "cu128"}, {extra = "cpu"}],
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = [
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]

[tool.ruff]
src = ["src"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "--strict-markers"
